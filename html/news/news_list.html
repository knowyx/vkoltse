{% extends "base.html" %}
{% from "items.html" import preview %}

{% block content %}
    <section class="reading mx-auto">
        <h1 class="mb-4">Новости проекта</h1>
        {% for item in news %}
            {{ preview(item, '/news') }}
        {% else %}
            <p class="border-top py-4 text-body-secondary">Новостей пока нет.</p>
        {% endfor %}
    </section>
{% endblock %}
